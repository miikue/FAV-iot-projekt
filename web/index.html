<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meteostanice</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">⛅ Meteostanice</div>
        <div class="header-meta">
            <span id="last-update">Načítání dat…</span>
            <span class="badge">2× Arduino</span>
        </div>
    </div>
</header>

<main>
    <div class="grid">

        <div class="card">
            <div class="card-title">
                <span class="dot red"></span> Venkovní teplota &amp; vlhkost
            </div>
            <canvas id="chartVenku"></canvas>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="dot blue"></span> Vnitřní teplota &amp; vlhkost
            </div>
            <canvas id="chartDoma"></canvas>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="dot green"></span> Srážky &amp; znečištění vzduchu
            </div>
            <canvas id="chartSrazky"></canvas>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="dot yellow"></span> Napětí baterií (venkovní jednotka)
            </div>
            <canvas id="chartVolt"></canvas>
        </div>

    </div>
</main>

<script>
    // --- shared state ---
    const venku = { cas: [], teplota: [], vlhkost: [], napeti: [], dest: [] };
    const doma  = { cas: [], teplota: [], vlhkost: [], vzduch: [] };

    const chartDefaults = {
        responsive: true,
        maintainAspectRatio: true,
        legend: { position: 'top', labels: { fontColor: '#c9d1d9', fontSize: 12 } },
        scales: {
            xAxes: [{ ticks: { fontColor: '#8b949e', maxTicksLimit: 8, maxRotation: 0 }, gridLines: { color: '#30363d' } }],
            yAxes: [{ ticks: { fontColor: '#8b949e' }, gridLines: { color: '#30363d' } }]
        },
        title: { display: false }
    };

    function makeDataset(label, data, color, fill = false) {
        return { label, data, borderColor: color, backgroundColor: fill ? color + '22' : 'transparent',
                 borderWidth: 2, pointRadius: 0, fill };
    }

    async function fetchCSV(url) {
        const res = await fetch(url);
        const text = await res.text();
        return text.split(/\r?\n/).slice(1).filter(r => r.trim());
    }

    async function loadVenku() {
        const rows = await fetchCSV('data/dataVenku.csv');
        rows.forEach(row => {
            const [cas, teplota, vlhkost, napeti, dest] = row.split(',').map(s => s.trim());
            venku.cas.push(cas);
            venku.teplota.push(parseFloat(teplota));
            venku.vlhkost.push(parseFloat(vlhkost));
            venku.napeti.push(parseFloat(napeti));
            venku.dest.push(parseFloat(dest));
        });
    }

    async function loadDoma() {
        const rows = await fetchCSV('data/dataDoma.csv');
        rows.forEach(row => {
            const [cas, teplota, vlhkost, vzduch] = row.split(',').map(s => s.trim());
            doma.cas.push(cas);
            doma.teplota.push(parseFloat(teplota));
            doma.vlhkost.push(parseFloat(vlhkost));
            doma.vzduch.push(parseFloat(vzduch));
        });
    }

    function buildCharts() {
        new Chart(document.getElementById('chartVenku'), {
            type: 'line',
            data: { labels: venku.cas, datasets: [
                makeDataset('Teplota (°C)', venku.teplota, '#f85149', true),
                makeDataset('Vlhkost (%)',  venku.vlhkost,  '#58a6ff')
            ]},
            options: { ...chartDefaults }
        });

        new Chart(document.getElementById('chartDoma'), {
            type: 'line',
            data: { labels: doma.cas, datasets: [
                makeDataset('Teplota (°C)', doma.teplota, '#f0883e', true),
                makeDataset('Vlhkost (%)',  doma.vlhkost,  '#79c0ff')
            ]},
            options: { ...chartDefaults }
        });

        new Chart(document.getElementById('chartSrazky'), {
            type: 'line',
            data: { labels: venku.cas, datasets: [
                makeDataset('Srážky',            venku.dest,  '#3fb950', true),
                makeDataset('Znečištění vzduchu', doma.vzduch, '#bc8cff')
            ]},
            options: { ...chartDefaults }
        });

        new Chart(document.getElementById('chartVolt'), {
            type: 'line',
            data: { labels: venku.cas, datasets: [
                makeDataset('Napětí (V)', venku.napeti, '#e3b341', true)
            ]},
            options: { ...chartDefaults }
        });
    }

    async function init() {
        await Promise.all([loadVenku(), loadDoma()]);

        const last = venku.cas.at(-1) ?? doma.cas.at(-1);
        if (last) {
            document.getElementById('last-update').textContent = 'Poslední záznam: ' + last;
        }

        buildCharts();
    }

    init();

    // auto-reload každou minutu
    setTimeout(() => location.reload(true), 60_000);
</script>

</body>
</html>
