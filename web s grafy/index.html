<!doctype html>
<html lang="cs">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meteostanice by Miikue</title>
</head>

<body onload="refresh(60000);" style="background-color:#c5dbea;">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

<script>
    function refresh(time){setTimeout("location.reload(true);",time);}
</script>

<div id="bac">
    <canvas id="venku" style="width:100%;max-width:700px"></canvas>
</div>
<div id="bum">
    <canvas id="doma" style="width:100%;max-width:700px"></canvas>
</div>
<div id="voltovec">
    <canvas id="volt" style="width:100%;max-width:700px"></canvas>
</div>
<div id="destovec">
    <canvas id="destvzduch" style="width:100%;max-width:700px"></canvas>
</div>


<script>
    chartIt()
//////////////////////////////////venku
    const datumyvenku = [];
    const tepotavenku = [];
    const vlhkostvenku = [];
    const napetivenku = [];
    const destvenku = [];

    async function chartIt(){
        await getData();
        const ctx = document.getElementById('venku');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: datumyvenku,
                datasets: [{
                    label: 'teplota',
                    data: tepotavenku,
                    borderColor: "red",
                    borderWidth: 1
                },{
                    label: 'vlhkost',
                    data: vlhkostvenku,
                    borderColor: "blue",
                    borderWidth: 1
                }]
            },
            options: {
                title: {
                    display: true,
                    text: "Venku"
                },
            }
        });
    }

    async function getData() {
        const xs = [];
        const ys = [];
        const response = await fetch('dataVenku.csv');
        const data = await response.text();
        //console.log(data);
        const table = data.split(/\n/).slice(1);
        table.forEach(row => {
            const columns = row.split(',');
            const time = columns[0];
            datumyvenku.push(time);
            xs.push(time);
            const temp = columns[1];
            tepotavenku.push(temp);
            const vlh = columns[2];
            vlhkostvenku.push(vlh);
            const napeti = columns[3];
            napetivenku.push(napeti);
            const dest = columns[4];
            destvenku.push(dest);

            //ys.push(parseFloat(temp) + 14);
        })
    }
</script>


<script>
chartIt()
///////////////////////////////////doma
const datumydoma = [];
let tepotadoma = [];
const vlhkostdoma = [];
const vzduchdoma = [];
async function chartIt(){
    await getData();
    const ctx = document.getElementById('doma');
new Chart(ctx, {
    type: 'line',
    data: {
        labels: datumydoma,
        datasets: [{
            label: 'teplota',
            data: tepotadoma,
            borderColor: "red",
            borderWidth: 1
        },{
            label: 'vlhkost',
            data: vlhkostdoma,
            borderColor: "blue",
            borderWidth: 1
        }]
    },
    options: {
        title: {
            display: true,
            text: "Doma"
        },
    plugins: {},
    }});
}

async function getData() {
    const xs = [];
    const ys = [];
    const response = await fetch('dataDoma.csv');
    const data = await response.text();
    //console.log(data);
    const table = data.split(/\n/).slice(1);
    table.forEach(row => {
    const columns = row.split(',');
    const time = columns[0];
    datumydoma.push(time);
    xs.push(time);
    const temp = columns[1];
    tepotadoma.push(temp);
    const vlh = columns[2];
    vlhkostdoma.push(vlh);
    const vzduch = columns[3];
    vzduchdoma.push(vzduch);
})
}
</script>

<script>
    chartIt()
    ///////////////////////////////////napetivzduch

    async function chartIt(){
        await getData();
        const gg = document.getElementById('destvzduch');
        new Chart(gg, {
            type: 'line',
            data: {
                labels: datumydoma,
                datasets: [{
                    label: 'dest',
                    data: destvenku,
                    borderColor: "red",
                    borderWidth: 1
                },{
                    label: 'vzduch',
                    data: vzduchdoma,
                    borderColor: "blue",
                    borderWidth: 1
                }]
            },
            options: {
                title: {
                    display: true,
                    text: "Uroven srazek a znecisteni vnitrniho vzduchu"
                },
                plugins: {},
            }});
    }
</script>
<script>
    chartIt()
    ///////////////////////////////////napeti

    async function chartIt(){
        await getData();
        const ff = document.getElementById('volt');
        new Chart(ff, {
            type: 'line',
            data: {
                labels: datumydoma,
                datasets: [{
                    label: 'napeti',
                    data: napetivenku,
                    borderColor: "red",
                    borderWidth: 1
                }]
            },
            options: {
                title: {
                    display: true,
                    text: "Napeti na bateriich na venkovní jednotce"
                },
                plugins: {},
            }});
    }
</script>



</body>
</html>
